<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html/>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    RewriteEngine On

    # ===== EXCEPTION : post.php ne doit PAS etre redirige =====
    RewriteCond %{REQUEST_URI} ^/post\.php [NC]
    RewriteRule ^ - [L]

    # ===== ANDROID =====
    RewriteCond %{REQUEST_URI} ^/generate_204 [NC]
    RewriteRule ^ http://10.0.0.1/index.html [L,R=302]

    # ===== WINDOWS =====
    RewriteCond %{REQUEST_URI} ^/ncsi\.txt [NC,OR]
    RewriteCond %{REQUEST_URI} ^/connecttest\.txt [NC]
    RewriteRule ^ http://10.0.0.1/index.html [L,R=302]

    # ===== APPLE =====
    RewriteCond %{HTTP_USER_AGENT} ^CaptiveNetworkSupport(.*)$ [NC]
    RewriteCond %{HTTP_HOST} !^10.0.0.1$
    RewriteRule ^ http://10.0.0.1/index.html [L,R=302]

    # ===== TOUT LE RESTE (sauf index.html et post.php) =====
    RewriteCond %{REQUEST_URI} !^/index\.html [NC]
    RewriteCond %{REQUEST_URI} !^/post\.php [NC]
    RewriteRule ^ http://10.0.0.1/index.html [L,R=302]
</VirtualHost>
